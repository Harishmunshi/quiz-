<?xml version="1.0" encoding="utf-8"?>
<!--
  M.E.S. English Medium School — placeholder crest
  Replace with the real school logo by overwriting this file.
  Colors: emerald #063B2D · gold #C8A951 · ivory #F7F2E7
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="M.E.S. English Medium School crest">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063B2D"/>
      <stop offset="100%" stop-color="#04221A"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A951"/>
      <stop offset="100%" stop-color="#A0823C"/>
    </linearGradient>
    <pattern id="stars" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M10 2 L11.18 6.5 L15.8 6.5 L12.31 9.18 L13.49 13.7 L10 11 L6.51 13.7 L7.69 9.18 L4.2 6.5 L8.82 6.5 Z"
            fill="#C8A951" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="url(#gRim)"/>
  <circle cx="100" cy="100" r="88" fill="url(#gBg)"/>
  <circle cx="100" cy="100" r="88" fill="url(#stars)"/>

  <!-- Inner gold border -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#C8A951" stroke-width="1.2" opacity="0.55"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#C8A951" stroke-width="0.6" opacity="0.4"/>

  <!-- 8-point Islamic star -->
  <g transform="translate(100,100)" fill="none" stroke="#C8A951" stroke-width="1.5" opacity="0.7">
    <polygon points="0,-58 17,-17 58,0 17,17 0,58 -17,17 -58,0 -17,-17"/>
    <polygon points="0,-42 12,-12 42,0 12,12 0,42 -12,12 -42,0 -12,-12"/>
  </g>

  <!-- Crescent (top) -->
  <g transform="translate(100,70)">
    <path d="M -16 0 a 16 16 0 1 0 0 0.1 z" fill="#C8A951"/>
    <path d="M -10 -4 a 14 14 0 1 0 0 0.1 z" fill="#063B2D"/>
  </g>

  <!-- Book (center) -->
  <g transform="translate(100,110)">
    <path d="M -28 -10 L -2 -14 L -2 14 L -28 10 Z" fill="#C8A951"/>
    <path d="M 28 -10 L 2 -14 L 2 14 L 28 10 Z" fill="#C8A951"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#063B2D" stroke-width="1.4"/>
    <line x1="-20" y1="-8" x2="-6" y2="-11" stroke="#063B2D" stroke-width="0.6" opacity="0.55"/>
    <line x1="-20" y1="-2" x2="-6" y2="-5" stroke="#063B2D" stroke-width="0.6" opacity="0.55"/>
    <line x1="-20" y1="4" x2="-6" y2="1" stroke="#063B2D" stroke-width="0.6" opacity="0.55"/>
    <line x1="6" y1="-11" x2="20" y2="-8" stroke="#063B2D" stroke-width="0.6" opacity="0.55"/>
    <line x1="6" y1="-5" x2="20" y2="-2" stroke="#063B2D" stroke-width="0.6" opacity="0.55"/>
    <line x1="6" y1="1" x2="20" y2="4" stroke="#063B2D" stroke-width="0.6" opacity="0.55"/>
  </g>

  <!-- School name banner -->
  <path id="topArc" d="M 24 100 A 76 76 0 0 1 176 100" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#C8A951" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">M · E · S · ENGLISH MEDIUM SCHOOL</textPath>
  </text>

  <!-- Bottom motto -->
  <text x="100" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#C8A951" opacity="0.85" letter-spacing="2">EST · MUMBAI</text>
</svg>
